services:
  # ==========================================
  # Database PostgreSQL (Terisolasi dari Publik)
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: rstay-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rstay_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-rstay_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rstay-internal-net
    # HARDENING 1: Port database TIDAK dibuka ke host (terkunci dari internet)
    expose:
      - "5432"
    # HARDENING 2: Cabut hak istimewa superuser kernel
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

  # ==========================================
  # Web App Next.js (Pengguna Non-Root)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rstay-web
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rstay_secure_db_pass_2026}@db:5432/${POSTGRES_DB:-rstay_db}?schema=public
      NODE_ENV: production
      PORT: 3000
    networks:
      - rstay-internal-net
    # HARDENING 3: Hanya dibuka ke localhost lokal
    ports:
      - "127.0.0.1:3000:3000"
    # HARDENING 4: Cabut seluruh kapabilitas root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  rstay-internal-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
